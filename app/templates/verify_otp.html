{% extends "base.html" %}{% block content %}<section class="auth-card"><h1>{{title}}</h1><p class="muted">We sent one OTP to <strong>{{email}}</strong> and one to <strong>{{phone}}</strong>.</p><form method="post" class="form"><label>Email OTP<input name="email_otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>Mobile OTP<input name="sms_otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><button class="primary">Verify & Continue</button></form></section>{% endblock %}
