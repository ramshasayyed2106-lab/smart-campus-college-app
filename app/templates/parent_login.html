{% extends "base.html" %}{% block content %}<section class="auth-card"><div class="logo-mark">SC</div><h1>Parent Portal</h1><p class="muted">Enter your child's College ID and the parent mobile number registered by the college.</p><form method="post" class="form"><label>Student College ID<input name="student_id" required autocomplete="off"></label><label>Parent Mobile Number<input name="parent_phone" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" minlength="10" maxlength="10" required></label><button class="primary">View Parent Portal</button></form><p class="muted">This portal is read-only.</p><div class="login-prompt"><a href="{{ url_for('auth.login') }}">Student / Faculty Login</a></div></section>{% endblock %}
