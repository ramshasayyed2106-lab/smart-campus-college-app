{% extends "base.html" %}{% block content %}<section class="auth-card"><h1>Change Password</h1><form method="post" class="form"><div class="password-wrap"><label>Current Password<input id="old" name="old_password" type="password" required></label><button type="button" class="show-pass" data-target="old">Show</button></div><div class="password-wrap"><label>New Password<input id="new" name="new_password" type="password" minlength="6" required></label><button type="button" class="show-pass" data-target="new">Show</button></div><div class="password-wrap"><label>Confirm New Password<input id="new2" name="confirm_password" type="password" minlength="6" required></label><button type="button" class="show-pass" data-target="new2">Show</button></div><button class="primary">Change Password</button></form></section>{% endblock %}
