{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h1>Change Password</h1>
  {% if not otp_requested %}
    <p class="muted">Enter the mobile number registered with your account. An OTP will be sent to that number.</p>
    <form method="post" class="form">
      <input type="hidden" name="action" value="request">
      <label>Registered Mobile Number
        <input name="registered_phone" type="tel" inputmode="numeric" pattern="[0-9]{10}"
               minlength="10" maxlength="10" placeholder="Enter your registered mobile number" required>
      </label>
      <button class="primary" type="submit">Send OTP</button>
    </form>
  {% else %}
    <p class="muted">OTP sent to your registered mobile number ending in <strong>{{ phone[-4:] }}</strong>.</p>
    <form method="post" class="form">
      <input type="hidden" name="action" value="verify">
      <input type="hidden" name="challenge_id" value="{{ challenge_id }}">
      <label>SMS OTP
        <input name="sms_otp" inputmode="numeric" maxlength="6" pattern="[0-9]{6}"
               placeholder="Enter 6-digit OTP" required>
      </label>
      <label>New Password
        <input name="new_password" type="password" minlength="8" required>
      </label>
      <label>Confirm Password
        <input name="confirm_password" type="password" minlength="8" required>
      </label>
      <button class="primary" type="submit">Change Password</button>
    </form>
  {% endif %}
</section>
{% endblock %}
