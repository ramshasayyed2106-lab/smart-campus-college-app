{% extends "base.html" %}{% block content %}<section class="auth-card"><div class="logo-mark">SC</div><h1>Login</h1><p class="muted">Choose your account type and use the ID/password created during registration.</p><form method="post" class="form"><label>Account Type<select name="role" required><option value="">Select Student or Faculty</option><option value="STUDENT">Student</option><option value="FACULTY">Faculty</option></select></label><label id="login-id-label">ID<input name="login_id" required placeholder="College ID or Faculty ID"></label><div class="password-wrap"><label>Password<input id="login-password" name="password" type="password" required></label><button type="button" class="show-pass" data-target="login-password">Show</button></div><button class="primary">Login</button></form><div class="login-prompt">Don't have an account? <a href="{{ url_for('main.index') }}">Register first</a></div></section>{% endblock %}
