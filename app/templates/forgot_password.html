{% extends "base.html" %}{% block content %}<section class="auth-card"><h1>Forgot Password</h1><p class="muted">Enter your registered mobile number. An OTP will be sent to that number.</p><form method="post" class="form"><label>Registered Mobile Number<input name="phone" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label><button class="primary">Send OTP</button></form><div class="login-prompt"><a href="{{url_for('auth.login')}}">Back to Login</a></div></section>{% endblock %}
