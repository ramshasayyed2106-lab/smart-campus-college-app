<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12395b"><link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><title>Smart Campus</title></head><body><header class="topbar"><a class="brand" href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('main.index') }}">SMART CAMPUS</a>{% if current_user.is_authenticated %}<nav class="topnav"><a href="{{ url_for('main.dashboard') }}">Dashboard</a><a href="{{ url_for('main.profile_page') }}">Profile</a><form method="post" action="{{ url_for('auth.logout') }}"><button class="outline">Logout</button></form></nav>{% endif %}</header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='app.js') }}"></script></body></html>
