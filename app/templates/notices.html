{% extends "base.html" %}{% block content %}<section class="page-head"><h1>Notices & Updates</h1></section><section class="panel">{% for n in rows %}<article class="notice"><span class="badge">{{n.notice_type}}</span><h3>{{n.title}}</h3><p>{{n.body}}</p><small>{{n.created_at.strftime('%d %b %Y, %I:%M %p')}}</small></article>{% else %}<p class="muted">No notices published.</p>{% endfor %}</section>{% endblock %}
