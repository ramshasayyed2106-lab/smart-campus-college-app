{% extends "base.html" %}{% block content %}<section class="page-head"><h1>Mark Attendance</h1><p class="muted">Select an active lecture. Your location must be inside the faculty-defined area and your live face must match your registered face.</p></section><section class="panel"><h2>Attendance Summary</h2><p id="attendance-summary">Loading attendance percentage…</p></section><div class="grid"><section class="card wide"><label>Active lecture<select id="session-select"><option value="">Select lecture</option>{% for s in sessions %}<option value="{{s.id}}">{{s.subject}} — {{s.starts_at.strftime('%d %b %Y, %I:%M %p')}} — radius {{s.radius_m|round|int}}m</option>{% endfor %}</select></label><div class="camera-grid"><div><video id="attendance-camera" autoplay playsinline></video><canvas id="attendance-canvas" hidden></canvas></div><div><button id="attendance-start-camera" class="secondary">Start Camera</button><button id="mark-attendance" class="primary">Mark Attendance</button><p id="attendance-status" class="status"></p></div></div></section></div>{% endblock %}
