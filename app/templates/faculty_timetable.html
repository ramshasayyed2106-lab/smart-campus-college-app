{% extends "base.html" %}{% block content %}<section class="page-head"><h1>Manage Timetable</h1></section><section class="panel"><form method="post" class="form two-col"><label>Type<select name="entry_type"><option>DAILY</option><option>EXAM</option></select></label><label>Title<input name="title" required></label><label>Subject<input name="subject"></label><label>Room<input name="room"></label><label>Date<input name="entry_date" type="date" required></label><label>Start<input name="start_time" type="time" required></label><label>End<input name="end_time" type="time" required></label><label>Semester<input name="semester" type="number" min="1" max="12"></label><button class="primary">Add Timetable Entry</button></form></section><section class="panel"><table><tr><th>Date</th><th>Type</th><th>Subject</th><th>Room</th><th>Time</th></tr>{% for r in rows %}<tr><td>{{r.entry_date}}</td><td>{{r.entry_type}}</td><td>{{r.subject or r.title}}</td><td>{{r.room}}</td><td>{{r.start_time}}–{{r.end_time}}</td></tr>{% else %}<tr><td colspan="5">No entries.</td></tr>{% endfor %}</table></section>{% endblock %}
