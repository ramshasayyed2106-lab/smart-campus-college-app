{% extends "base.html" %}{% block content %}<section class="page-head"><h1>Publish Notices</h1></section><section class="panel"><form method="post" class="form"><label>Notice Type<select name="notice_type"><option>GENERAL</option><option>HOLIDAY</option><option>LECTURE_CANCELLED</option><option>EXAM</option><option>URGENT</option></select></label><label>Title<input name="title" required></label><label>Notice<textarea name="body" rows="5" required></textarea></label><button class="primary">Publish Notice</button></form></section><section class="panel">{% for n in rows %}<article class="notice"><span class="badge">{{n.notice_type}}</span><h3>{{n.title}}</h3><p>{{n.body}}</p></article>{% endfor %}</section>{% endblock %}
